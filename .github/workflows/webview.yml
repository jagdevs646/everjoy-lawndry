name: Measure Android WebView password fields
on:
  push:
    branches: [verify/office-claims-webview]
permissions:
  contents: read
jobs:
  webview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_API_BASE: http://127.0.0.1:3344
      DB_PATH: ':memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          npm ci --include=dev
          npm install --prefix /tmp/ej-webview-runner playwright-core@1.56.1
          npx vite build --mode app
          npx cap sync android
          cd android && bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb reverse tcp:3344 tcp:3344
            nohup npm start -- --demo --port 3344 >/tmp/everjoy-demo.log 2>&1 &
            curl --retry 15 --retry-all-errors --retry-delay 2 -fsS http://localhost:3344/api/health
            cd android && bash gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.everjoy.lawndry.PasswordLayoutTest
            adb logcat -d -s EverjoyLayout:I
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            NODE_PATH=/tmp/ej-webview-runner/node_modules node .github/workflows/verify-claim.cjs
